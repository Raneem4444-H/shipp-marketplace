name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-security-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app.py app_auth.py app_marketplace.py app_runtime.py config data_pipeline rag agent ui repositories test --select E9,F63,F7,F82

      - name: Bandit
        run: bandit -q -r app.py app_auth.py app_marketplace.py app_runtime.py config data_pipeline rag agent ui repositories -x test,tests,notebooks -ll -s B608

      - name: Unit tests
        run: PYTHONPATH="$PWD:$PWD/agent/agent_ship/src:$PWD/agent/agent_ship/tests/unit/agent" python -m pytest -q test/unit agent/agent_ship/tests/unit/agent

      - name: Compile application modules
        run: |
          python -m compileall -q \
            app.py app_auth.py app_marketplace.py app_runtime.py \
            ui services repositories
